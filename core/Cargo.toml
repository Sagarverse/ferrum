[package]
name = "metallic-mini"
version = "0.1.0"
edition = "2021"
description = "Professional-grade data protection platform with continuous backup, versioning, ransomware defense & automated recovery"
license = "MIT"
repository = "https://github.com/metallic-mini/metallic-mini"

[[bin]]
name = "metallic-mini"
path = "src/main.rs"

[lib]
name = "metallic_mini"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP server & WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Hashing - BLAKE3 (fastest cryptographic hash)
blake3 = "1"

# Content-defined chunking
fastcdc = "3"

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"

# File system watching
notify = "7"
notify-debouncer-full = "0.4"

# Identifiers & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
rand = "0.8"
base64 = "0.22"
hex = "0.4"
thiserror = "2"
anyhow = "1"
walkdir = "2"

# HTTP client (AI & cloud)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Async utilities
async-trait = "0.1"
async-stream = "0.3"

# Byte handling
bytes = "1"

# Directory management
dirs = "5"

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
